name: Build Libraries

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: both
        type: choice
        options:
          - android
          - ios
          - both
      android_api:
        description: Android API level
        required: true
        default: "23"
        type: string
      ndk_version:
        description: Android side-by-side NDK version (for example 27.2.12479018)
        required: true
        default: 27.2.12479018
        type: string
      openssl_version:
        description: OpenSSL version
        required: true
        default: 4.0.1
        type: string
      nghttp2_version:
        description: nghttp2 version
        required: true
        default: 1.70.0
        type: string
      curl_version:
        description: cURL version
        required: true
        default: 8.21.0
        type: string
      ios_min_version:
        description: Minimum iOS version
        required: true
        default: "13.0"
        type: string

permissions:
  contents: write

jobs:
  android:
    if: inputs.target == 'android' || inputs.target == 'both'
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install requested NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          sdkmanager "ndk;${{ inputs.ndk_version }}"
          test -d "${SDK_ROOT}/ndk/${{ inputs.ndk_version }}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${SDK_ROOT}/ndk/${{ inputs.ndk_version }}" >> "$GITHUB_ENV"

      - name: Verify NDK toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "NDK root: $ANDROID_NDK_ROOT"
          echo "Runner architecture: $(uname -m)"
          echo "Available NDK LLVM hosts:"
          find "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt" -maxdepth 1 -mindepth 1 -type d -print
          echo "Available clang binaries:"
          find "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt" -path '*/bin/clang' -print

      - name: Build Android
        env:
          ANDROID_API: ${{ inputs.android_api }}
          ANDROID_NDK_VERSION: ${{ inputs.ndk_version }}
          OPENSSL_VERSION: ${{ inputs.openssl_version }}
          NGHTTP2_VERSION: ${{ inputs.nghttp2_version }}
          CURL_VERSION: ${{ inputs.curl_version }}
        shell: bash
        run: bash ./scripts/build-android.sh "$ANDROID_API" "$ANDROID_NDK_VERSION"

      # Keep the artifact as one ZIP only. The previous workflow uploaded both
      # dist/android/** and the ZIP, which caused a ZIP containing another ZIP.
      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ inputs.android_api }}-ndk-${{ inputs.ndk_version }}
          path: dist/openssl-for-android-api-${{ inputs.android_api }}-ndk-${{ inputs.ndk_version }}.zip
          if-no-files-found: error
          retention-days: 14

  ios:
    if: inputs.target == 'ios' || inputs.target == 'both'
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path

      - name: Build iOS
        env:
          OPENSSL_VERSION: ${{ inputs.openssl_version }}
          NGHTTP2_VERSION: ${{ inputs.nghttp2_version }}
          CURL_VERSION: ${{ inputs.curl_version }}
          MIN_IOS_VERSION: ${{ inputs.ios_min_version }}
        shell: bash
        run: bash ./scripts/build-ios.sh

      - name: Upload iOS package
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.ios_min_version }}
          path: dist/openssl-for-ios-${{ inputs.openssl_version }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: >-
      always() &&
      (needs.android.result == 'success' || needs.android.result == 'skipped') &&
      (needs.ios.result == 'success' || needs.ios.result == 'skipped')
    needs: [android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android package
        if: inputs.target == 'android' || inputs.target == 'both'
        uses: actions/download-artifact@v4
        with:
          name: android-api-${{ inputs.android_api }}-ndk-${{ inputs.ndk_version }}
          path: release-assets

      - name: Download iOS package
        if: inputs.target == 'ios' || inputs.target == 'both'
        uses: actions/download-artifact@v4
        with:
          name: ios-${{ inputs.ios_min_version }}
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          OPENSSL_VERSION: ${{ inputs.openssl_version }}
          NGHTTP2_VERSION: ${{ inputs.nghttp2_version }}
          CURL_VERSION: ${{ inputs.curl_version }}
          ANDROID_API: ${{ inputs.android_api }}
          NDK_VERSION: ${{ inputs.ndk_version }}
          IOS_MIN_VERSION: ${{ inputs.ios_min_version }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail

          case "$TARGET" in
            android)
              TITLE="[Only Android] OpenSSL-${OPENSSL_VERSION}, nghttp2-${NGHTTP2_VERSION} and cURL-${CURL_VERSION}"
              TAG="openssl-${OPENSSL_VERSION}-nghttp2-${NGHTTP2_VERSION}-curl-${CURL_VERSION}-android-api-${ANDROID_API}-ndk-${NDK_VERSION}-run-${RUN_NUMBER}"
              ;;
            ios)
              TITLE="[Only iOS] OpenSSL-${OPENSSL_VERSION}, nghttp2-${NGHTTP2_VERSION} and cURL-${CURL_VERSION}"
              TAG="openssl-${OPENSSL_VERSION}-nghttp2-${NGHTTP2_VERSION}-curl-${CURL_VERSION}-ios-${IOS_MIN_VERSION}-run-${RUN_NUMBER}"
              ;;
            both)
              TITLE="[Android + iOS] OpenSSL-${OPENSSL_VERSION}, nghttp2-${NGHTTP2_VERSION} and cURL-${CURL_VERSION}"
              TAG="openssl-${OPENSSL_VERSION}-nghttp2-${NGHTTP2_VERSION}-curl-${CURL_VERSION}-android-api-${ANDROID_API}-ndk-${NDK_VERSION}-ios-${IOS_MIN_VERSION}-run-${RUN_NUMBER}"
              ;;
            *)
              echo "Unsupported target: $TARGET" >&2
              exit 1
              ;;
          esac

          BODY_FILE="release-body.md"
          {
            echo "## Build information"
            echo
            echo "| library | version | platform support | arch support |"
            echo "|---|---|---|---|"
            if [[ "$TARGET" == "android" || "$TARGET" == "both" ]]; then
              echo "| OpenSSL | ${OPENSSL_VERSION} | Android | armeabi-v7a, arm64-v8a, x86, x86_64 |"
              echo "| nghttp2 | ${NGHTTP2_VERSION} | Android | armeabi-v7a, arm64-v8a, x86, x86_64 |"
              echo "| cURL | ${CURL_VERSION} | Android | armeabi-v7a, arm64-v8a, x86, x86_64 |"
            fi
            if [[ "$TARGET" == "ios" || "$TARGET" == "both" ]]; then
              echo "| OpenSSL | ${OPENSSL_VERSION} | iOS ${IOS_MIN_VERSION}+ | arm64 device, arm64 simulator |"
              echo "| nghttp2 | ${NGHTTP2_VERSION} | iOS ${IOS_MIN_VERSION}+ | arm64 device, arm64 simulator |"
              echo "| cURL | ${CURL_VERSION} | iOS ${IOS_MIN_VERSION}+ | arm64 device, arm64 simulator |"
            fi
            echo
            if [[ "$TARGET" == "android" || "$TARGET" == "both" ]]; then
              echo "**Android API:** ${ANDROID_API}"
              echo
              echo "**Android NDK:** ${NDK_VERSION}"
              echo
            fi
            if [[ "$TARGET" == "ios" || "$TARGET" == "both" ]]; then
              echo "**Minimum iOS:** ${IOS_MIN_VERSION}"
              echo
            fi
            echo "Build run: #${RUN_NUMBER}"
          } > "$BODY_FILE"

          echo "Release title: $TITLE"
          echo "Release tag: $TAG"
          cat "$BODY_FILE"
          find release-assets -type f -maxdepth 2 -print

          gh release create "$TAG" release-assets/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes-file "$BODY_FILE" \
            --latest
